[project]
name = "weldmon"
version = "0.1.0"
description = "Laser Welding Process Monitor : dashboard de démonstration (Dash/Plotly) sur le dataset Zenodo 22282527, projet personnel non commercial"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dash>=3.0",
    "dash-mantine-components>=2.0",
    "gunicorn>=23.0",
]

[dependency-groups]
# Traitements de données et signaux (légers : utilisables en CI).
analysis = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "openpyxl>=3.1",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
    "tqdm>=4.66",
]
# Entraînement / inférence du modèle de segmentation (GPU).
ml = [
    "torch>=2.5",
    "torchvision>=0.20",
    "segmentation-models-pytorch>=0.4",
    "timm>=1.0",
]
pipeline = [{ include-group = "analysis" }, { include-group = "ml" }]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weldmon"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Mises en page Dash très imbriquées : les textes d'interface priment sur la longueur de ligne.
"src/weldmon/app/tabs/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipeline"]
